services:
  - type: web
    name: expense-tracker-api
    env: node
    plan: free
    buildCommand: npm install && npm run build && npx drizzle-kit push
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: expense-tracker-db
    plan: free
    databaseName: expense_tracker_db
    user: expense_user
